name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Compile
        run: python -m compileall -q errfix

      - name: Test
        run: pytest -q

      - name: CLI smoke test
        run: |
          printf '%s\n' 'Traceback (most recent call last):' '  File "/tmp/app.py", line 1, in <module>' 'NameError: name "x" is not defined' | python -m errfix.cli --help >/dev/null || true
