[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "errfix"
version = "0.1.0"
description = "Zero-config terminal stack trace summarizer"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "rich>=13.0.0",
    "click>=8.0.0",
    "httpx>=0.24.0"
]

[project.scripts]
errfix = "errfix.cli:main"

[tool.setuptools.packages.find]
include = ["errfix*"]
exclude = ["assets*"]
