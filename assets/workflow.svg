<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">errfix workflow</title>
  <desc id="desc">Animated terminal-style visualization of errfix reading stderr, sanitizing paths, analyzing a stack trace, and rendering a proposed fix.</desc>
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}
    .panel{fill:#15171b;stroke:#3a3f48;stroke-width:2}
    .muted{fill:#9aa3af}.white{fill:#f3f4f6}.cyan{fill:#67e8f9}.green{fill:#86efac}.yellow{fill:#fde68a}.red{fill:#fca5a5}
    .pulse{animation:pulse 1.8s ease-in-out infinite}.step2{animation:pulse 1.8s ease-in-out .45s infinite}.step3{animation:pulse 1.8s ease-in-out .9s infinite}.step4{animation:pulse 1.8s ease-in-out 1.35s infinite}
    @keyframes pulse{0%,100%{opacity:.55;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
    .dash{stroke-dasharray:10 10;animation:dash 2.5s linear infinite}@keyframes dash{to{stroke-dashoffset:-40}}
  </style>
  <rect width="1200" height="620" rx="22" fill="#0b0d10"/>
  <rect x="24" y="24" width="1152" height="572" rx="18" class="panel"/>
  <circle cx="55" cy="58" r="7" fill="#ff5f57"/><circle cx="79" cy="58" r="7" fill="#febc2e"/><circle cx="103" cy="58" r="7" fill="#28c840"/>
  <text x="600" y="64" text-anchor="middle" font-size="21" font-weight="700" class="white">errfix · from stack trace to fix</text>
  <text x="60" y="112" font-size="19" class="cyan">$ python -c 'raise ValueError("demo error")' 2&gt;&amp;1 | errfix</text>
  <line x1="120" y1="225" x2="1080" y2="225" stroke="#47505c" stroke-width="3" class="dash"/>
  <g class="pulse"><rect x="60" y="155" width="240" height="130" rx="14" fill="#101318" stroke="#4b5563"/><text x="180" y="190" text-anchor="middle" font-size="18" class="cyan">01 · READ</text><text x="180" y="225" text-anchor="middle" font-size="15" class="muted">capture stderr</text><text x="180" y="250" text-anchor="middle" font-size="15" class="white">stdin / trace text</text></g>
  <g class="step2"><rect x="330" y="155" width="240" height="130" rx="14" fill="#101318" stroke="#4b5563"/><text x="450" y="190" text-anchor="middle" font-size="18" class="green">02 · SANITIZE</text><text x="450" y="225" text-anchor="middle" font-size="15" class="muted">remove local paths</text><text x="450" y="250" text-anchor="middle" font-size="15" class="white">keep useful context</text></g>
  <g class="step3"><rect x="630" y="155" width="240" height="130" rx="14" fill="#101318" stroke="#4b5563"/><text x="750" y="190" text-anchor="middle" font-size="18" class="yellow">03 · ANALYZE</text><text x="750" y="225" text-anchor="middle" font-size="15" class="muted">OpenAI-compatible API</text><text x="750" y="250" text-anchor="middle" font-size="15" class="white">validated JSON result</text></g>
  <g class="step4"><rect x="930" y="155" width="210" height="130" rx="14" fill="#101318" stroke="#4b5563"/><text x="1035" y="190" text-anchor="middle" font-size="18" class="red">04 · RENDER</text><text x="1035" y="225" text-anchor="middle" font-size="15" class="muted">Rich terminal</text><text x="1035" y="250" text-anchor="middle" font-size="15" class="white">problem + fix</text></g>
  <rect x="60" y="330" width="1080" height="210" rx="14" fill="#0f1115" stroke="#303640"/>
  <text x="88" y="370" font-size="17" class="red">ERROR SUMMARY</text>
  <text x="88" y="405" font-size="17" class="white">IndexError: list index out of range</text>
  <text x="88" y="438" font-size="15" class="muted">The trace is reduced to the useful block before inference.</text>
  <line x1="88" y1="465" x2="1112" y2="465" stroke="#303640"/>
  <text x="88" y="502" font-size="17" class="green">PROPOSED FIX</text>
  <text x="88" y="527" font-size="16" class="cyan">if items: value = items[0]</text>
</svg>
